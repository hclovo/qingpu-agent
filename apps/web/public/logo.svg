<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Base dark gradient for the rounded-square badge -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c3c3c"/>
      <stop offset="100%" stop-color="#062a2a"/>
    </linearGradient>
    <!-- Soft spinning light that circles inside the badge -->
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dfbff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#7dfbff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7dfbff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#7dfbff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7dfbff" stop-opacity="0"/>
    </linearGradient>
    <!-- Subtle inner shadow / depth glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7dfbff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#7dfbff" stop-opacity="0"/>
    </radialGradient>
    <!-- Clip to rounded square -->
    <clipPath id="rrect">
      <rect width="64" height="64" rx="14" ry="14"/>
    </clipPath>
    <style>
      .orbit { fill: none; stroke: #7dfbff; stroke-width: 1.6; stroke-linecap: round; }
      .nucleus { fill: #7dfbff; }
    </style>
  </defs>

  <!-- Rounded-square background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Depth glow behind the atom -->
  <rect width="64" height="64" rx="14" fill="url(#glow)"/>

  <!-- Atom symbol (three tilted ellipses + centre dot) -->
  <g clip-path="url(#rrect)">
    <!-- Bottom-left ellipse (0° tilt) -->
    <ellipse class="orbit" cx="32" cy="32" rx="9" ry="22"
             transform="rotate(0 32 32)"/>
    <!-- Top-right ellipse (60° tilt) -->
    <ellipse class="orbit" cx="32" cy="32" rx="9" ry="22"
             transform="rotate(60 32 32)"/>
    <!-- Bottom-right ellipse (120° tilt) -->
    <ellipse class="orbit" cx="32" cy="32" rx="9" ry="22"
             transform="rotate(120 32 32)"/>
    <!-- Centre nucleus -->
    <circle class="nucleus" cx="32" cy="32" r="3.2"/>
  </g>
</svg>
